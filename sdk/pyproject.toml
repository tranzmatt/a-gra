[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agra-sdk"
version = "0.1.0"
description = "Python SDK for A-GRA/UCI XML message mechanisms"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "OpenArsenal" }]
license = { text = "Proprietary documentation derived; SDK code local to this repository" }
dependencies = []

[project.scripts]
agra-sdk = "agra_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agra_sdk*"]
